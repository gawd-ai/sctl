[package]
name = "sctl-comms-abi"
version = "0.5.0"
edition = "2021"
description = "C ABI for sctl dynamically loaded comms plugins"
license = "GPL-3.0-only"
repository = "https://github.com/gawd-ai/sctl"
rust-version = "1.82"

[lib]
path = "src/lib.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
