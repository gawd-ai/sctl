# Virtual workspace over the four Rust crates. Before this existed they were
# four independent cargo projects with four lockfiles — and the two plugin
# crates (the stable C ABI and 1600 lines of unsafe FFI in the Quectel driver)
# were never compiled by CI at all, because CI only knew about server/ and mcp/.
# One workspace means one lockfile, one toolchain, one `cargo <cmd> --workspace`
# that cannot skip a member.
[workspace]
resolver = "2"
members = [
    "server",
    "mcp",
    "crates/sctl-comms-abi",
    "drivers/sctl-comms-quectel",
]

# One lint policy for every member (each declares `[lints] workspace = true`).
# Before this table, server/lib.rs carried 9 allows, server/main.rs only 3 of
# them (stricter by accident), mcp had no lint attributes at all, and the two
# plugin crates were never linted in CI to begin with.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Pedantic guard against any owned-return going unused. ~50 candidates
# triggered when re-enabled; almost none represent real bug-bait (every
# internal caller uses the return), so the annotation pressure outweighs the
# diagnostic value. Re-enable when a real "ignored result" bug shows up.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
unused_async = "allow"
# Suggests adding `S: BuildHasher` generics to functions taking HashMap
# params. The hits live in axum extractor signatures + shell helpers where
# the public API is keyed on `HashMap<String, String>`; generalizing would
# propagate the parameter through callers without any practical benefit.
implicit_hasher = "allow"

# Moved verbatim from server/ (abi and the quectel driver carried identical
# copies; mcp gains it deliberately — a size-trimmed proxy binary is fine).
# Workspaces ignore non-root [profile.*] sections, so this is the only copy
# that can exist.
#
# panic = "abort" is scheduled to flip to "unwind" in 0.6.0 Phase 1: the
# in-process recovery machinery (catch_unwind in the tunnel client, the
# JoinError-restart in main) is dead code under abort, and nothing respawns
# a crashed daemon on the RAM-boot units. The flip ships with the device
# resilience payload, not with this mechanical conversion.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
