[package]
name = "sctl-comms-quectel"
version = "0.5.0"
edition = "2021"
description = "Quectel AT comms plugin for sctl"
license = "GPL-3.0-only"
repository = "https://github.com/gawd-ai/sctl"
rust-version = "1.82"

[lib]
name = "sctl_comms_quectel"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
sctl-comms-abi = { path = "../../crates/sctl-comms-abi" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
