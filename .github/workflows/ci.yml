name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, Test & Doc (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1" # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # --workspace is the point: the per-directory jobs this replaces never
      # compiled crates/sctl-comms-abi or drivers/sctl-comms-quectel at all —
      # 1.6k lines of unsafe FFI shipped to devices without ever meeting CI.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Every .route() registered in server/src/main.rs and
      # server/src/tunnel/relay.rs must have a matching ### `METHOD /path`
      # heading in docs/http-api.md (and no heading may document a route
      # that no longer exists). Keeps the hand-written API reference honest.
      - name: HTTP API docs drift gate
        run: python3 scripts/check-http-api-docs.py
      # Every `pub` field on every struct in server/src/config.rs must appear
      # in docs/config.md and in server/sctl.toml.example (commented-out
      # counts). Keeps the config reference and the example file honest.
      - name: Config docs drift gate
        run: python3 scripts/check-config-docs.py
      # `cargo test` above regenerated the ts-rs bindings (export_bindings).
      # A dirty tree here means someone changed a Rust type and committed
      # without re-running the tests — the web client would type-check green
      # against silently wrong definitions. This diff is the only thing that
      # can see that.
      - run: git diff --exit-code -- web/src/lib/types/generated
      - name: No stray bindings output
        run: test ! -e server/bindings || (echo "stray ts-rs output at server/bindings — the workspace .cargo/config.toml env should make this impossible; investigate" && exit 1)
      - run: cargo doc --workspace --no-deps

  check-web:
    name: Check & Package (sctlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run package
        working-directory: web

  build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: [check, check-web]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace

  build-arm:
    name: Build (ARM / OpenWrt)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1" # keep in sync with rust-toolchain.toml
          targets: armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      # From the workspace root (Cross.toml lives there now); -p selects the
      # device daemon — the only crate that ships to ARM.
      - run: cross build --release --target armv7-unknown-linux-musleabihf -p sctl

  # Floating-stable canary: the next toolchain surprise (43b7130 was clippy
  # 1.97 growing for_kv_map mid-flight) should arrive as a visible warning on
  # this job, never as a red main. Allowed to fail; never gates anything.
  canary-floating:
    name: Canary (latest stable)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Bypass rust-toolchain.toml so this job genuinely floats.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
