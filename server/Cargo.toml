[package]
name = "sctl"
version = "0.5.0"
edition = "2021"
description = "Remote device control server for AI agents — HTTP + WebSocket API with PTY support"
license = "GPL-3.0-only"
authors = ["Alexandre Grenier"]
repository = "https://github.com/gawd-ai/sctl"
homepage = "https://github.com/gawd-ai/sctl"
readme = "README.md"
keywords = ["remote-shell", "ai-agent", "pty", "embedded", "iot"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.97"

[features]
default = []

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "signal", "sync", "time", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sctl-comms-abi = { path = "../crates/sctl-comms-abi" }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
libc = "0.2"
nix = { version = "0.29", features = ["term", "signal", "process", "fs"] }
sha2 = "0.10"
# http2 is +176 KB gzipped on the mips boot payload (measured 2026-08-10). Kept
# because gRPC endpoints on LAN gear -- the Starlink dish's Device API among them
# -- are HTTP/2 only, and re-provisioning the payload later costs more than this.
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
# The tunnel client performs the rustls handshake directly so it can add CA/pin checks.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
futures-util = "0.3"
serde_yaml = "0.9"
tokio-util = { version = "0.7", features = ["io"] }
libloading = "0.8"


[dev-dependencies]
ts-rs = { version = "^12", features = ["serde-json-impl"] }
